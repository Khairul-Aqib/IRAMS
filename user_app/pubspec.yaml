name: user_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.1.0
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # UI / Routing
  go_router: ^17.0.0
  intl: ^0.20.2

  # Maps + Location
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  flutter_map: ^8.2.2       # kept for pages not yet migrated
  latlong2: ^0.9.1          # kept for existing pages during migration

  # Networking
  dio: ^5.7.0

  # Payments (ToyyibPay bill flow)
  webview_flutter: ^4.10.0

  # PDF viewing + local storage (receipt download)
  syncfusion_flutter_pdfviewer: ^30.1.38
  path_provider: ^2.1.5

  # Utilities
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/IRAMS(BlackLogo).jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
  - assets/map_style_dark.json
  - lib/images/LoginBG.jpg
  - lib/images/getStartedBG.jpg
  - lib/images/Logo.png
  - lib/images/Logo_2.png
  - lib/images/car_bg.jpg
  - lib/images/admin1.jpg
